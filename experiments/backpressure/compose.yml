# 개발 환경과 이미지·DB·포트·볼륨을 분리한다. ON/OFF에서 같은 이미지를 사용한다.
services:
  postgres:
    ports: !override ["127.0.0.1::5432"]
  migrate:
    image: async-job-backpressure:local
  api:
    image: async-job-backpressure:local
    ports: !override ["127.0.0.1::3000"]
    environment:
      LOG_LEVEL: info
  worker:
    image: async-job-backpressure:local
    environment:
      LOG_LEVEL: info
  prometheus:
    ports: !override ["127.0.0.1::9090"]
